<!-- @dsCard group="Actions" height=336 subtitle="Default, primary, subtle, icon, split and toggle, in every state" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Button</title>
<style>
.bt{display:grid;grid-template-columns:max-content repeat(5,max-content);gap:var(--space-2) var(--space-3);align-items:center}
</style>
</head>
<body>
<div class="pv app-imago">
<div class="bt">
  <span></span><span class="pv-k">rest</span><span class="pv-k">hover</span><span class="pv-k">pressed</span><span class="pv-k">focus</span><span class="pv-k">disabled</span>
  <span class="pv-k">Default</span><span class="ph-btn " role="button">Cancel</span><span class="ph-btn is-hover" role="button">Cancel</span><span class="ph-btn is-pressed" role="button">Cancel</span><span class="ph-btn is-focus" role="button">Cancel</span><span class="ph-btn is-disabled" role="button" aria-disabled="true">Cancel</span>
  <span class="pv-k">Primary</span><span class="ph-btn primary " role="button">Apply</span><span class="ph-btn primary is-hover" role="button">Apply</span><span class="ph-btn primary is-pressed" role="button">Apply</span><span class="ph-btn primary is-focus" role="button">Apply</span><span class="ph-btn primary is-disabled" role="button" aria-disabled="true">Apply</span>
  <span class="pv-k">Subtle</span><span class="ph-btn subtle " role="button"><i data-i="rotate" data-s="16"></i>Reset</span><span class="ph-btn subtle is-hover" role="button"><i data-i="rotate" data-s="16"></i>Reset</span><span class="ph-btn subtle is-pressed" role="button"><i data-i="rotate" data-s="16"></i>Reset</span><span class="ph-btn subtle is-focus" role="button"><i data-i="rotate" data-s="16"></i>Reset</span><span class="ph-btn subtle is-disabled" role="button" aria-disabled="true"><i data-i="rotate" data-s="16"></i>Reset</span>
  <span class="pv-k">Icon</span><span class="ph-btn icon " role="button"><i data-i="trash" data-s="16"></i></span><span class="ph-btn icon is-hover" role="button"><i data-i="trash" data-s="16"></i></span><span class="ph-btn icon is-pressed" role="button"><i data-i="trash" data-s="16"></i></span><span class="ph-btn icon is-focus" role="button"><i data-i="trash" data-s="16"></i></span><span class="ph-btn icon is-disabled" role="button" aria-disabled="true"><i data-i="trash" data-s="16"></i></span>
  <span class="pv-k">Split</span><span class="ph-split"><span class="ph-btn " role="button">Export</span><span class="ph-btn " role="button"><i data-i="chevron-down" data-s="12" data-w="2"></i></span></span><span class="ph-split"><span class="ph-btn is-hover" role="button">Export</span><span class="ph-btn is-hover" role="button"><i data-i="chevron-down" data-s="12" data-w="2"></i></span></span><span class="ph-split"><span class="ph-btn is-pressed" role="button">Export</span><span class="ph-btn is-pressed" role="button"><i data-i="chevron-down" data-s="12" data-w="2"></i></span></span><span class="ph-split"><span class="ph-btn is-focus" role="button">Export</span><span class="ph-btn is-focus" role="button"><i data-i="chevron-down" data-s="12" data-w="2"></i></span></span><span class="ph-split"><span class="ph-btn is-disabled" role="button" aria-disabled="true">Export</span><span class="ph-btn is-disabled" role="button" aria-disabled="true"><i data-i="chevron-down" data-s="12" data-w="2"></i></span></span>
  <span class="pv-k">Toggle on</span><span class="ph-btn icon toggle is-on " role="button"><i data-i="magnet" data-s="16"></i></span><span class="ph-btn icon toggle is-on is-hover" role="button"><i data-i="magnet" data-s="16"></i></span><span class="ph-btn icon toggle is-on is-pressed" role="button"><i data-i="magnet" data-s="16"></i></span><span class="ph-btn icon toggle is-on is-focus" role="button"><i data-i="magnet" data-s="16"></i></span><span class="ph-btn icon toggle is-on is-disabled" role="button" aria-disabled="true"><i data-i="magnet" data-s="16"></i></span>
</div>
<div class="pv-row"><span class="pv-k">Primary per app</span><span class="app-nodus"><span class="ph-btn primary" role="button">Create</span></span><span class="app-imago"><span class="ph-btn primary" role="button">Create</span></span><span class="app-lumen"><span class="ph-btn primary" role="button">Import 248 photos</span></span></div>
<div class="pv-row ph-comfortable"><span class="pv-k">Comfortable</span><span class="ph-btn " role="button">Cancel</span><span class="ph-btn primary" role="button">Apply</span><span class="ph-btn icon" role="button"><i data-i="trash" data-s="16"></i></span></div>
</div>
<script>
if (window.Photon) Photon.hydrate(document);
</script>
</body>
</html>
