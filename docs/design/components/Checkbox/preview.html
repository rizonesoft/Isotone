<!-- @dsCard group="Inputs" height=212 subtitle="Unchecked, checked, indeterminate across states; the three Highlight options" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Checkbox</title>
<style>
.cb{display:grid;grid-template-columns:max-content repeat(5,max-content);gap:var(--space-2) var(--space-4);align-items:center}
</style>
</head>
<body>
<div class="pv">
<div class="cb">
  <span></span><span class="pv-k">rest</span><span class="pv-k">hover</span><span class="pv-k">pressed</span><span class="pv-k">disabled</span><span class="pv-k">focus</span>
  <span class="pv-k">Unchecked</span><span class="ph-check " role="checkbox" aria-checked="false"><span class="box"><i data-i="check" data-s="12" data-w="2.5" data-c="c"></i><i data-i="minus" data-s="12" data-w="2.5" data-c="m"></i></span><span>Snap</span></span><span class="ph-check is-hover" role="checkbox" aria-checked="false"><span class="box"><i data-i="check" data-s="12" data-w="2.5" data-c="c"></i><i data-i="minus" data-s="12" data-w="2.5" data-c="m"></i></span><span>Snap</span></span><span class="ph-check is-pressed" role="checkbox" aria-checked="false"><span class="box"><i data-i="check" data-s="12" data-w="2.5" data-c="c"></i><i data-i="minus" data-s="12" data-w="2.5" data-c="m"></i></span><span>Snap</span></span><span class="ph-check is-disabled" role="checkbox" aria-checked="false"><span class="box"><i data-i="check" data-s="12" data-w="2.5" data-c="c"></i><i data-i="minus" data-s="12" data-w="2.5" data-c="m"></i></span><span>Snap</span></span><span class="ph-check is-focus" role="checkbox" aria-checked="false"><span class="box"><i data-i="check" data-s="12" data-w="2.5" data-c="c"></i><i data-i="minus" data-s="12" data-w="2.5" data-c="m"></i></span><span>Snap</span></span>
  <span class="pv-k">Checked</span><span class="ph-check is-checked " role="checkbox" aria-checked="true"><span class="box"><i data-i="check" data-s="12" data-w="2.5" data-c="c"></i><i data-i="minus" data-s="12" data-w="2.5" data-c="m"></i></span><span>Snap</span></span><span class="ph-check is-checked is-hover" role="checkbox" aria-checked="true"><span class="box"><i data-i="check" data-s="12" data-w="2.5" data-c="c"></i><i data-i="minus" data-s="12" data-w="2.5" data-c="m"></i></span><span>Snap</span></span><span class="ph-check is-checked is-pressed" role="checkbox" aria-checked="true"><span class="box"><i data-i="check" data-s="12" data-w="2.5" data-c="c"></i><i data-i="minus" data-s="12" data-w="2.5" data-c="m"></i></span><span>Snap</span></span><span class="ph-check is-checked is-disabled" role="checkbox" aria-checked="true"><span class="box"><i data-i="check" data-s="12" data-w="2.5" data-c="c"></i><i data-i="minus" data-s="12" data-w="2.5" data-c="m"></i></span><span>Snap</span></span><span class="ph-check is-checked is-focus" role="checkbox" aria-checked="true"><span class="box"><i data-i="check" data-s="12" data-w="2.5" data-c="c"></i><i data-i="minus" data-s="12" data-w="2.5" data-c="m"></i></span><span>Snap</span></span>
  <span class="pv-k">Indeterminate</span><span class="ph-check is-mixed " role="checkbox" aria-checked="mixed"><span class="box"><i data-i="check" data-s="12" data-w="2.5" data-c="c"></i><i data-i="minus" data-s="12" data-w="2.5" data-c="m"></i></span><span>Snap</span></span><span class="ph-check is-mixed is-hover" role="checkbox" aria-checked="mixed"><span class="box"><i data-i="check" data-s="12" data-w="2.5" data-c="c"></i><i data-i="minus" data-s="12" data-w="2.5" data-c="m"></i></span><span>Snap</span></span><span class="ph-check is-mixed is-pressed" role="checkbox" aria-checked="mixed"><span class="box"><i data-i="check" data-s="12" data-w="2.5" data-c="c"></i><i data-i="minus" data-s="12" data-w="2.5" data-c="m"></i></span><span>Snap</span></span><span class="ph-check is-mixed is-disabled" role="checkbox" aria-checked="mixed"><span class="box"><i data-i="check" data-s="12" data-w="2.5" data-c="c"></i><i data-i="minus" data-s="12" data-w="2.5" data-c="m"></i></span><span>Snap</span></span><span class="ph-check is-mixed is-focus" role="checkbox" aria-checked="mixed"><span class="box"><i data-i="check" data-s="12" data-w="2.5" data-c="c"></i><i data-i="minus" data-s="12" data-w="2.5" data-c="m"></i></span><span>Snap</span></span>
</div>
<div class="pv-row"><span class="pv-k">Highlight color</span><span class="ph-check is-checked" role="checkbox" aria-checked="true"><span class="box"><i data-i="check" data-s="12" data-w="2.5" data-c="c"></i><i data-i="minus" data-s="12" data-w="2.5" data-c="m"></i></span><span>Blue (default)</span></span><span class="hl-orange"><span class="ph-check is-checked" role="checkbox" aria-checked="true"><span class="box"><i data-i="check" data-s="12" data-w="2.5" data-c="c"></i><i data-i="minus" data-s="12" data-w="2.5" data-c="m"></i></span><span>Photon orange</span></span></span><span class="hl-windows"><span class="ph-check is-checked" role="checkbox" aria-checked="true"><span class="box"><i data-i="check" data-s="12" data-w="2.5" data-c="c"></i><i data-i="minus" data-s="12" data-w="2.5" data-c="m"></i></span><span>Windows accent (example: #0078D4)</span></span></span></div>
<div class="pv-row ph-comfortable"><span class="pv-k">Comfortable (16px box)</span><span class="ph-check is-checked" role="checkbox" aria-checked="true"><span class="box"><i data-i="check" data-s="12" data-w="2.5" data-c="c"></i><i data-i="minus" data-s="12" data-w="2.5" data-c="m"></i></span><span>Resample</span></span><span class="ph-check " role="checkbox" aria-checked="false"><span class="box"><i data-i="check" data-s="12" data-w="2.5" data-c="c"></i><i data-i="minus" data-s="12" data-w="2.5" data-c="m"></i></span><span>Constrain proportions</span></span></div>
</div>
<script>
if (window.Photon) Photon.hydrate(document);
</script>
</body>
</html>
