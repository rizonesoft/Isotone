<!-- @dsCard group="Foundations" height=252 subtitle="Highlight color options: Blue (default), Photon orange, Windows accent" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Highlight</title>
<style>
.hlw{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-3);padding:var(--space-3)}
.hlw > div{display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-3);border:1px solid var(--divider);border-radius:var(--radius-sm);background:var(--surface-panel)}
.hlw .ph-menu{min-width:0;width:100%}
.hlw .ph-slider{width:120px}
</style>
</head>
<body>
<div class="hlw">
<div class="">
  <span class="pv-h">Blue (default)</span>
  <div class="pv-row"><button class="ph-tool group is-checked" aria-label=""><i data-i="brush" data-s="20"></i></button><button class="ph-tool group" aria-label=""><i data-i="eraser" data-s="20"></i></button><span class="ph-check is-checked" role="checkbox" aria-checked="true"><span class="box"><i data-i="check" data-s="12" data-w="2.5" data-c="c"></i><i data-i="minus" data-s="12" data-w="2.5" data-c="m"></i></span><span>Snap</span></span><span class="ph-toggle is-on" role="switch" aria-checked="true"><span class="track"></span><span></span></span></div>
  <div class="ph-row is-selected" style="border-radius:var(--radius-sm)"><i data-i="layers" data-s="14"></i>Retouch</div>
  <div class="ph-menu" style="box-shadow:none"><div class="ph-mi is-hl" role="menuitem"><span class="ic"></span><span>Copy</span><span class="sc">Ctrl+C</span><span class="sub"></span></div></div>
  <div class="pv-row"><span class="ph-slider" aria-hidden="true"><span class="tr"></span><span class="fi" style="width:70px"></span><span class="th" style="left:75px"></span></span><a class="ph-link">Learn more</a></div>
  <span class="ph-field is-focus"><input value="Focused field" aria-label="Layer name"></span>
</div><div class="hl-orange">
  <span class="pv-h">Photon orange</span>
  <div class="pv-row"><button class="ph-tool group is-checked" aria-label=""><i data-i="brush" data-s="20"></i></button><button class="ph-tool group" aria-label=""><i data-i="eraser" data-s="20"></i></button><span class="ph-check is-checked" role="checkbox" aria-checked="true"><span class="box"><i data-i="check" data-s="12" data-w="2.5" data-c="c"></i><i data-i="minus" data-s="12" data-w="2.5" data-c="m"></i></span><span>Snap</span></span><span class="ph-toggle is-on" role="switch" aria-checked="true"><span class="track"></span><span></span></span></div>
  <div class="ph-row is-selected" style="border-radius:var(--radius-sm)"><i data-i="layers" data-s="14"></i>Retouch</div>
  <div class="ph-menu" style="box-shadow:none"><div class="ph-mi is-hl" role="menuitem"><span class="ic"></span><span>Copy</span><span class="sc">Ctrl+C</span><span class="sub"></span></div></div>
  <div class="pv-row"><span class="ph-slider" aria-hidden="true"><span class="tr"></span><span class="fi" style="width:70px"></span><span class="th" style="left:75px"></span></span><a class="ph-link">Learn more</a></div>
  <span class="ph-field is-focus"><input value="Focused field" aria-label="Layer name"></span>
</div><div class="hl-windows">
  <span class="pv-h">Windows accent (example: #0078D4)</span>
  <div class="pv-row"><button class="ph-tool group is-checked" aria-label=""><i data-i="brush" data-s="20"></i></button><button class="ph-tool group" aria-label=""><i data-i="eraser" data-s="20"></i></button><span class="ph-check is-checked" role="checkbox" aria-checked="true"><span class="box"><i data-i="check" data-s="12" data-w="2.5" data-c="c"></i><i data-i="minus" data-s="12" data-w="2.5" data-c="m"></i></span><span>Snap</span></span><span class="ph-toggle is-on" role="switch" aria-checked="true"><span class="track"></span><span></span></span></div>
  <div class="ph-row is-selected" style="border-radius:var(--radius-sm)"><i data-i="layers" data-s="14"></i>Retouch</div>
  <div class="ph-menu" style="box-shadow:none"><div class="ph-mi is-hl" role="menuitem"><span class="ic"></span><span>Copy</span><span class="sc">Ctrl+C</span><span class="sub"></span></div></div>
  <div class="pv-row"><span class="ph-slider" aria-hidden="true"><span class="tr"></span><span class="fi" style="width:70px"></span><span class="th" style="left:75px"></span></span><a class="ph-link">Learn more</a></div>
  <span class="ph-field is-focus"><input value="Focused field" aria-label="Layer name"></span>
</div>
</div>
<script>
if (window.Photon) Photon.hydrate(document);
</script>
</body>
</html>
