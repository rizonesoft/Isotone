<!-- @dsCard group="Inputs" height=128 subtitle="Selected and unselected across states" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RadioButton</title>
<style>
.rb{display:grid;grid-template-columns:max-content repeat(5,max-content);gap:var(--space-2) var(--space-4);align-items:center}
</style>
</head>
<body>
<div class="pv"><div class="rb" role="radiogroup">
  <span></span><span class="pv-k">rest</span><span class="pv-k">hover</span><span class="pv-k">pressed</span><span class="pv-k">disabled</span><span class="pv-k">focus</span>
  <span class="pv-k">Unselected</span><span class="ph-check radio " role="radio" aria-checked="false"><span class="box"></span><span>Percent</span></span><span class="ph-check radio is-hover" role="radio" aria-checked="false"><span class="box"></span><span>Percent</span></span><span class="ph-check radio is-pressed" role="radio" aria-checked="false"><span class="box"></span><span>Percent</span></span><span class="ph-check radio is-disabled" role="radio" aria-checked="false"><span class="box"></span><span>Percent</span></span><span class="ph-check radio is-focus" role="radio" aria-checked="false"><span class="box"></span><span>Percent</span></span>
  <span class="pv-k">Selected</span><span class="ph-check radio is-checked " role="radio" aria-checked="true"><span class="box"></span><span>Pixels</span></span><span class="ph-check radio is-checked is-hover" role="radio" aria-checked="true"><span class="box"></span><span>Pixels</span></span><span class="ph-check radio is-checked is-pressed" role="radio" aria-checked="true"><span class="box"></span><span>Pixels</span></span><span class="ph-check radio is-checked is-disabled" role="radio" aria-checked="true"><span class="box"></span><span>Pixels</span></span><span class="ph-check radio is-checked is-focus" role="radio" aria-checked="true"><span class="box"></span><span>Pixels</span></span>
</div></div>
<script>
if (window.Isotone) Isotone.hydrate(document);
</script>
</body>
</html>
