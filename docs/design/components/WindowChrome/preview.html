<!-- @dsCard group="Shell" height=236 subtitle="Custom title bar: app mark, menu bar, caption buttons" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WindowChrome</title>
<style>
.tb-stack{display:flex;flex-direction:column;gap:var(--space-3)}
.tb-states{display:grid;grid-template-columns:repeat(6,var(--caption-button-w));gap:var(--space-2) var(--space-1);align-items:center;justify-items:center}
.tb-states .ph-cap{background-color:var(--frame)}
.tb-states .ph-cap.is-hover{background:var(--surface-control-hover)}
.tb-states .ph-cap.is-pressed{background:var(--surface-control-pressed)}
.tb-states .ph-cap.close.is-hover{background:var(--caption-close-hover)}
.tb-states .ph-cap.close.is-pressed{background:var(--caption-close-pressed)}
</style>
</head>
<body>
<div class="pv tb-stack">
<div class="pv-k">Imago, active window, Edit menu open</div>
<div class="ph-titlebar app-imago">
  <div class="ph-appmark"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" role="img" aria-label="Imago"><defs><linearGradient id="imago-c-s16-spec" x1="0" y1="0" x2="16" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FF4D6D"/><stop offset="0.17" stop-color="#FF9A3C"/><stop offset="0.33" stop-color="#FFD84A"/><stop offset="0.5" stop-color="#4CC47A"/><stop offset="0.67" stop-color="#29C5E6"/><stop offset="0.83" stop-color="#5B7CFF"/><stop offset="1" stop-color="#B45CFF"/></linearGradient><clipPath id="imago-c-s16-clip"><rect x="0" y="0" width="16" height="16" rx="3"/></clipPath></defs><rect x="0" y="0" width="16" height="16" rx="3" fill="#2B2C31"/><rect x="0" y="14" width="16" height="2" fill="url(#imago-c-s16-spec)" clip-path="url(#imago-c-s16-clip)"/><path d="M8.53 4.73L10.27 6.47L12.64 3.36L11.64 2.36Z" fill="#F5923E"/><path d="M6.92 5.84L9.16 8.08L10.27 6.96L8.04 4.73Z" fill="#FFFFFF"/><path d="M5.3 9.7L8.01 9.61L9.09 8.52L6.48 5.91L5.39 6.99Z" fill="#FFD84A"/><rect x="2" y="11" width="2" height="2" fill="#FFD84A"/><rect x="3" y="7" width="1" height="1" fill="#FFD84A"/></svg></div>
  <div class="ph-menubar" role="menubar"><div class="ph-mb" role="menuitem">File</div><div class="ph-mb is-open" role="menuitem">Edit</div><div class="ph-mb" role="menuitem">Image</div><div class="ph-mb" role="menuitem">Layer</div><div class="ph-mb" role="menuitem">Select</div><div class="ph-mb is-hover" role="menuitem">Filter</div><div class="ph-mb" role="menuitem">View</div><div class="ph-mb" role="menuitem">Window</div><div class="ph-mb" role="menuitem">Help</div></div>
  <div class="drag"></div>
  <div class="ph-caps"><button class="ph-cap" aria-label="Minimize"><i data-i="minus" data-s="14" data-w="1"></i></button><button class="ph-cap" aria-label="Maximize"><i data-i="maximize" data-s="14" data-w="1"></i></button><button class="ph-cap close is-hover" aria-label="Close"><i data-i="x" data-s="14" data-w="1"></i></button></div>
</div>
<div class="pv-k">Nodus, inactive window</div>
<div class="ph-titlebar app-nodus is-inactive">
  <div class="ph-appmark"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" role="img" aria-label="Nodus"><defs><linearGradient id="nodus-c-s16-spec" x1="0" y1="0" x2="16" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FF4D6D"/><stop offset="0.17" stop-color="#FF9A3C"/><stop offset="0.33" stop-color="#FFD84A"/><stop offset="0.5" stop-color="#4CC47A"/><stop offset="0.67" stop-color="#29C5E6"/><stop offset="0.83" stop-color="#5B7CFF"/><stop offset="1" stop-color="#B45CFF"/></linearGradient><clipPath id="nodus-c-s16-clip"><rect x="0" y="0" width="16" height="16" rx="3"/></clipPath></defs><rect x="0" y="0" width="16" height="16" rx="3" fill="#2B2C31"/><rect x="0" y="14" width="16" height="2" fill="url(#nodus-c-s16-spec)" clip-path="url(#nodus-c-s16-clip)"/><rect x="5.5" y="10" width="6" height="1" fill="#29C5E6"/><path d="M5.5 10.5L7.22 4.86L8.63 3.45L10.59 5.41L9.11 6.89A0.85 0.85 0 0 0 7.9 8.1Z" fill="#8BE6F7"/><path d="M5.5 10.5L11.14 8.78L12.55 7.37L10.59 5.41L9.11 6.89A0.85 0.85 0 0 1 7.9 8.1Z" fill="#29C5E6"/><path d="M9.73 3.2L12.8 6.27L14.03 5.04L10.96 1.97Z" fill="#1597BA"/><rect x="10" y="9" width="3" height="3" fill="#FFFFFF"/><rect x="4" y="9" width="3" height="3" fill="#FFFFFF"/></svg></div>
  <div class="ph-menubar" role="menubar"><div class="ph-mb" role="menuitem">File</div><div class="ph-mb" role="menuitem">Edit</div><div class="ph-mb" role="menuitem">Object</div><div class="ph-mb" role="menuitem">Path</div><div class="ph-mb" role="menuitem">Type</div><div class="ph-mb" role="menuitem">Select</div><div class="ph-mb" role="menuitem">View</div><div class="ph-mb" role="menuitem">Window</div><div class="ph-mb" role="menuitem">Help</div></div>
  <div class="drag"></div>
  <div class="ph-caps"><button class="ph-cap" aria-label="Minimize"><i data-i="minus" data-s="14" data-w="1"></i></button><button class="ph-cap" aria-label="Maximize"><i data-i="maximize" data-s="14" data-w="1"></i></button><button class="ph-cap close " aria-label="Close"><i data-i="x" data-s="14" data-w="1"></i></button></div>
</div>
<div class="pv-k">Lumen, maximized (restore glyph)</div>
<div class="ph-titlebar app-lumen">
  <div class="ph-appmark"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" role="img" aria-label="Lumen"><defs><linearGradient id="lumen-c-s16-spec" x1="0" y1="0" x2="16" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FF4D6D"/><stop offset="0.17" stop-color="#FF9A3C"/><stop offset="0.33" stop-color="#FFD84A"/><stop offset="0.5" stop-color="#4CC47A"/><stop offset="0.67" stop-color="#29C5E6"/><stop offset="0.83" stop-color="#5B7CFF"/><stop offset="1" stop-color="#B45CFF"/></linearGradient><clipPath id="lumen-c-s16-clip"><rect x="0" y="0" width="16" height="16" rx="3"/></clipPath></defs><rect x="0" y="0" width="16" height="16" rx="3" fill="#2B2C31"/><rect x="0" y="14" width="16" height="2" fill="url(#lumen-c-s16-spec)" clip-path="url(#lumen-c-s16-clip)"/><circle cx="7.5" cy="7.5" r="5.3" fill="#0B3A1C"/><path d="M8.92 6.68L11.72 8.3A4.3 4.3 0 0 1 8.92 11.56Z" fill="#9BE8B6"/><path d="M8.92 8.32L8.92 11.56A4.3 4.3 0 0 1 4.69 10.76Z" fill="#4CC47A"/><path d="M7.5 9.13L4.69 10.76A4.3 4.3 0 0 1 3.28 6.7Z" fill="#9BE8B6"/><path d="M6.08 8.32L3.28 6.7A4.3 4.3 0 0 1 6.08 3.44Z" fill="#4CC47A"/><path d="M6.08 6.68L6.08 3.44A4.3 4.3 0 0 1 10.31 4.24Z" fill="#9BE8B6"/><path d="M7.5 5.87L10.31 4.24A4.3 4.3 0 0 1 11.72 8.3Z" fill="#4CC47A"/><g stroke="#0B3A1C" stroke-width="0.8"><path d="M7.5 5.87L11.72 8.3"/><path d="M8.92 6.68L8.92 11.56"/><path d="M8.92 8.32L4.69 10.76"/><path d="M7.5 9.13L3.28 6.7"/><path d="M6.08 8.32L6.08 3.44"/><path d="M6.08 6.68L10.31 4.24"/></g><path d="M7.5 5.87L8.92 6.68L8.92 8.32L7.5 9.13L6.08 8.32L6.08 6.68Z" fill="#000000"/></svg></div>
  <div class="ph-menubar" role="menubar"><div class="ph-mb" role="menuitem">File</div><div class="ph-mb" role="menuitem">Edit</div><div class="ph-mb" role="menuitem">Library</div><div class="ph-mb" role="menuitem">Photo</div><div class="ph-mb" role="menuitem">Develop</div><div class="ph-mb" role="menuitem">View</div><div class="ph-mb" role="menuitem">Window</div><div class="ph-mb" role="menuitem">Help</div></div>
  <div class="drag"></div>
  <div class="ph-caps"><button class="ph-cap"><i data-i="minus" data-s="14" data-w="1"></i></button><button class="ph-cap is-focus"><i data-i="restore" data-s="14" data-w="1"></i></button><button class="ph-cap close"><i data-i="x" data-s="14" data-w="1"></i></button></div>
</div>
<div class="tb-states">
  <span class="pv-k">rest</span><span class="pv-k">hover</span><span class="pv-k">pressed</span><span class="pv-k">close hover</span><span class="pv-k">close pressed</span><span class="pv-k">focus</span>
  <button class="ph-cap"><i data-i="minus" data-s="14" data-w="1"></i></button><button class="ph-cap is-hover"><i data-i="minus" data-s="14" data-w="1"></i></button><button class="ph-cap is-pressed"><i data-i="minus" data-s="14" data-w="1"></i></button><button class="ph-cap close is-hover"><i data-i="x" data-s="14" data-w="1"></i></button><button class="ph-cap close is-pressed"><i data-i="x" data-s="14" data-w="1"></i></button><button class="ph-cap is-focus"><i data-i="maximize" data-s="14" data-w="1"></i></button>
</div>
</div>
<script>
if (window.Photon) Photon.hydrate(document);
</script>
</body>
</html>
