<!-- @dsCard group="Feedback" height=196 subtitle="Determinate and indeterminate bars, rings, launch progress" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Progress</title>
<style>
.pg{display:grid;grid-template-columns:max-content max-content;gap:var(--space-3) var(--space-6);align-items:center}
</style>
</head>
<body>
<div class="pv app-lumen"><div class="pg">
  <div class="pv-col"><span class="pv-k">Determinate (state-line)</span><div class="pv-row"><span class="ph-progress" role="progressbar" aria-valuenow="42"><span class="v" style="width:42%;display:block"></span></span><span class="pv-k">42% · 104 of 248</span><span class="ph-btn subtle" role="button">Cancel</span></div></div>
  <div class="pv-col"><span class="pv-k">Indeterminate</span><span class="ph-progress indet" role="progressbar"><span class="v"></span></span></div>
  <div class="pv-col"><span class="pv-k">Launch (splash only: app accent)</span><span class="ph-progress accent"><span class="v" style="width:68%;display:block"></span></span></div>
  <div class="pv-col"><span class="pv-k">Failed</span><div class="pv-row"><span class="ph-progress error"><span class="v" style="width:76%;display:block"></span></span><span class="ph-help error"><i data-i="error" data-s="12"></i>Stopped at 188 of 248</span></div></div>
  <div class="pv-col"><span class="pv-k">Rings 16 / 32</span><div class="pv-row">
    <svg class="ph-ring" width="16" height="16" viewBox="0 0 16 16" role="progressbar"><circle class="bgc" cx="8" cy="8" r="6.5" fill="none" stroke-width="2"/><circle class="fgc" cx="8" cy="8" r="6.5" fill="none" stroke-width="2" stroke-dasharray="12 40.8" stroke-linecap="round"/></svg>
    <svg class="ph-ring" width="32" height="32" viewBox="0 0 32 32" role="progressbar"><circle class="bgc" cx="16" cy="16" r="14" fill="none" stroke-width="3"/><circle class="fgc" cx="16" cy="16" r="14" fill="none" stroke-width="3" stroke-dasharray="26 62" stroke-linecap="round"/></svg>
    <span class="pv-k">Loading previews…</span></div></div>
</div></div>
<script>
if (window.Photon) Photon.hydrate(document);
</script>
</body>
</html>
