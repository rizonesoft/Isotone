<!-- @dsCard group="Foundations" height=150 subtitle="One keyboard focus ring: 2px focus-ring, 1px outside; inset on rows" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FocusRing</title>
<style>
.fr{display:flex;flex-wrap:wrap;gap:var(--space-4);align-items:flex-end}
.fr .ph-list{width:180px;border:1px solid var(--divider)}
</style>
</head>
<body>
<div class="pv app-pinxit"><div class="fr">
  <div class="pv-col"><span class="pv-k">button</span><span class="ph-btn primary is-focus" role="button">Apply</span></div>
  <div class="pv-col"><span class="pv-k">field (border + inner 1px)</span><span class="ph-field is-focus"><input value="Retouch" aria-label="Layer name"></span></div>
  <div class="pv-col"><span class="pv-k">checkbox</span><span class="ph-check is-checked is-focus" role="checkbox" aria-checked="true"><span class="box"><i data-i="check" data-s="12" data-w="2.5" data-c="c"></i><i data-i="minus" data-s="12" data-w="2.5" data-c="m"></i></span><span>Snap</span></span></div>
  <div class="pv-col"><span class="pv-k">tool</span><button class="ph-tool group is-focus" aria-label=""><i data-i="brush" data-s="20"></i></button></div>
  <div class="pv-col"><span class="pv-k">swatch</span><button class="ph-swatch is-focus" style="background:#29c5e6"></button></div>
  <div class="pv-col"><span class="pv-k">row (inset, on selection)</span><div class="ph-list"><div class="ph-row is-selected is-focus" role="treeitem" style="padding-left:8px"><span class="chev"></span><i data-i="image" data-s="14"></i><span>02 Harbor</span></div></div></div>
</div>
<div class="pv-row"><span class="pv-k">Follows the Highlight color:</span><span class="hl-orange"><span class="ph-btn is-focus" role="button">Isotone orange</span></span><span class="hl-windows"><span class="ph-btn is-focus" role="button">Windows accent</span></span></div>
</div>
<script>
if (window.Isotone) Isotone.hydrate(document);
</script>
</body>
</html>
