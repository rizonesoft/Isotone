# The writer and the independent reviewer for this repository, read by scripts/review-dispatch.py.
#
# One writer, one reviewer, no fallback. Claude Code on Claude Opus 5.5 is always the solo writer (operator decision
# 2026-10-23, which retired the routes other writers once had). The reviewer is of a different model family (the CLI
# names it: codex is OpenAI, agy is Google), and there is no fallback (operator decision 2026-09-25, kept 2026-10-21
# and 2026-10-22): a round the reviewer cannot return is retried by the campaign and then parks that section
# (2026-10-23), and the writer's family never reviews. Every review round runs through this pin: the panel rounds, the
# completion review, the architecture gate, the plan review, the stamp review, and the independent pass.
#
# Loaded strictly: an unknown key, an unknown CLI, a malformed model, a second writer, or a reviewer of the writer's
# family refuses every dispatch. Re-pinning the reviewer is one edit here; nothing else in the tree names a model.

schema_version = 2

[writer]
agent = "claude"
model = "claude-opus-5-5"

# GPT-6.1 Sol through the Codex CLI at medium effort, read-only sandbox (operator decision 2026-10-23: "set the
# reviewer effort level to medium", after two capacity outages at xhigh that day). Sol was pinned at xhigh, the highest
# effort Codex accepts, on 2026-10-22, replacing GPT-6 Astra at medium (the 2026-10-21 pin): in Recto's three-way
# trial (.conclave/reviewer-trial-2026-10-22.md there), Sol at xhigh found all three verified defects and the other
# two pins two each, at about 2.3x Astra's wall time.
[reviewer]
name = "sol"
cli = "codex"
model = "gpt-6.1-sol"
effort = "medium"
