# Independent reviewers for this repository, read by scripts/review-dispatch.py.
#
# A route names one reviewer and at most one fallback for work written by one agent, and neither is of the writer's
# own model family (the CLI names it: codex is OpenAI, agy is Google, claude is Anthropic). Claude Code is Isotone's
# only writer (operator decision), so only the claude route exists. It names GPT-6.1 Sol alone: there is no fallback
# (operator decision 2026-09-25, kept 2026-10-21 and 2026-10-22), so a round Sol cannot return waits for the operator,
# and the writer's family never reviews. Every review round runs through this route: the panel rounds, the
# architecture gate, the plan review, the stamp review, and the independent pass.
#
# Loaded strictly: an unknown key, an unknown CLI, a malformed model, a route naming an undefined reviewer, a
# same-family reviewer or a second fallback refuses every dispatch. `python scripts/panel_slots.py validate` also
# refuses a claude route with a fallback. Re-pinning a reviewer is one edit here; nothing else in the tree names a
# model.

schema_version = 1

# GPT-6.1 Sol through the Codex CLI at xhigh, the highest effort Codex accepts, read-only sandbox (owner decision
# 2026-10-22). It replaces GPT-6 Astra at medium (the 2026-10-21 pin): in Recto's three-way trial
# (.conclave/reviewer-trial-2026-10-22.md there), Sol at xhigh found all three verified defects and the other two
# pins two each, at about 2.3x Astra's wall time.
[reviewers.sol]
cli = "codex"
model = "gpt-6.1-sol"
effort = "xhigh"

[routes]
claude = ["sol"]
