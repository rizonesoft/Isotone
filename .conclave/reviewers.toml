# Independent reviewers for this repository, read by scripts/review-dispatch.py.
#
# A route lists reviewers in failover order for work written by one agent. The
# first reviewer that runs and returns a review is the round; one that is not
# installed, fails, times out or returns nothing is skipped and the reason is
# recorded. If every reviewer fails there is no review, never an approval.
#
# Loaded strictly: an unknown key, an unknown CLI, a malformed model or a route
# naming an undefined reviewer refuses every dispatch.
#
# Isotone narrows the Conclave-SDK reviewer kit to its own panel decisions
# (.conclave/panel.toml): Claude Code is the only writer, every review runs
# GPT-6 Astra through codex, there is no fallback, and no Claude-family model
# reviews Claude's work (operator decision 2026-10-19). So the route has one
# reviewer and a failed round waits for the operator. Astra runs at high, the
# effort of every non-bulk panel slot. TODO sections keep their review through
# review-todo-section and `python scripts/panel_slots.py exec <slot>`; this
# pin serves ad hoc independent reviews outside a section.

schema_version = 1

# GPT-6 Astra through the Codex CLI, read-only sandbox.
[reviewers.astra]
cli = "codex"
model = "gpt-6-astra"
effort = "high"

[routes]
claude = ["astra"]
