# Independent reviewers for this repository, read by scripts/review_pin.py and scripts/review-dispatch.py.
#
# Operator decision 2026-11-10: Antigravity (`agy`) on Gemini 4 Carbon (Medium) (`gemini-4-carbon-medium`, pinned in
# `scripts/panel_slots.py`) takes over from Claude Code as the writer in this repository. Operator decision 2026-11-10:
# the reviewer is GPT-6 Astra always, whichever of Antigravity (`agy`) or Claude Code (`claude`) wrote the work, so
# each route names `astra` alone with no fallback (operator decisions 2026-09-25, 2026-10-21, and 2026-10-23).
# Operator decision 2026-11-12: adopt Conclave-SDK's `three-pass` review schedule (`plan` -> one `round` ->
# `completion`, plus `reconciliation` only when completion returns blocking gaps).
#
# Loaded strictly by `scripts/review_pin.py`: an unknown key, an unknown CLI, a malformed model, a route naming an
# undefined reviewer or more than 1 reviewer, a reviewer of the writer's own model family, or overlapping lenses
# across `plan`, `round`, and `completion` refuses every dispatch.

schema_version = 1

# GPT-6 Astra through the Codex CLI, read-only sandbox (operator decision 2026-11-10: "The reviewer should be GPT6
# Astra."). Effort is medium (operator decision 2026-10-23: "set the reviewer effort level to medium").
[reviewers.astra]
cli = "codex"
model = "gpt-6-astra"
effort = "medium"

[routes]
agy = ["astra"]
claude = ["astra"]

[schedule]
policy = "three-pass"
pass_cap = 33
blocking = ["P1", "P2"]

# The project's own lenses (D00 T01 section 10; operator request 2026-09-27, "how are we preventing drift in docs,
# readme's, suporting files, comments, descriptions"). `docs-drift` runs in the round, where the code is read.
[schedule.lenses]
docs-drift = "Does the range update every README, document, standard, skill and source comment that describes behaviour it changed? Name each one that still describes the old behaviour, with file:line and the sentence that is now false. A text that states the old behaviour is at least P2: the writer and the reviewers act on these documents, so a false one is a wrong result waiting to happen, and the stamp is refused while one remains."

[schedule.plan]
effort = "medium"
lenses = ["plan"]

[[schedule.rounds]]
effort = "medium"
lenses = ["adversarial", "consistency", "integration", "quality", "optimization", "source-defect", "design", "docs-drift"]

[schedule.completion]
effort = "medium"
lenses = ["plan-delivery", "record"]

[schedule.reconciliation]
effort = "medium"
lenses = ["adversarial", "integration", "plan-delivery", "record"]
