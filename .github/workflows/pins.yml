name: pins

# Keeps every repository pin and dependency advisory check current (operator request 2026-10-21, the RectoPDF shape).
# Daily, each check runs the same script the developer runs locally. A finding that needs the owner becomes one issue
# that the next clean run closes. GitHub's notifications tell the owner, and a failed job here (a source could not be
# read, a pin is malformed) emails whoever last edited this schedule.
# GitHub Actions are updated by Dependabot (.github/dependabot.yml). Checks only this PC can see (its CLIs and Python)
# stay in .conclave/automations.
# Each job holds only the token permissions its check uses (independent review 2026-10-21): the native-advisories job
# reads the repository and files issues.

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pins
  cancel-in-progress: false

jobs:
  native-advisories:
    name: native-advisories
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Run the check
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-native-advisories.py issue
