name: plan-gates

# Plan tooling gates (adapted from Resolute's plan.yml): the TODO graph tool
# self-tests, the TODO tree validates, the plan projection is current, the
# commit hook is intact (mode 100755, LF). The campaign guard self-test drives
# the real Stop hook through powershell.exe, so it runs in a Windows job.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'todo/**'
      - 'docs/reviews/**'
      - '.claude/**'
      - '.conclave/**'
      - 'tools/githooks/**'
      - 'docs/design/**'
      - 'resources/icons/**'
      - '.gitattributes'
      - 'AGENTS.md'
      - '.github/workflows/plan.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'todo/**'
      - 'docs/reviews/**'
      - '.claude/**'
      - '.conclave/**'
      - 'tools/githooks/**'
      - 'docs/design/**'
      - 'resources/icons/**'
      - '.gitattributes'
      - 'AGENTS.md'
      - '.github/workflows/plan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan-gates:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the validator's git legs (provenance candidates,
          # fix-commit proofs, ancestry) cannot resolve on a shallow checkout.
          fetch-depth: 0
      - name: Self-test the TODO graph tool
        run: python3 scripts/todo-graph.py self-test
      - name: Self-test design-lint
        run: python3 scripts/design-lint.py --self-test
      - name: Self-test the panel and delegation wiring
        run: python3 scripts/panel_slots.py --self-test
      - name: Validate the panel slots, delegate pin, and agent definitions
        run: python3 scripts/panel_slots.py validate
      - name: Self-test the weakening scan
        run: python3 scripts/weakening-scan.py --self-test
      - name: Validate the TODO tree
        run: python3 scripts/todo-graph.py validate
      - name: Check the design system page is current
        run: python3 scripts/build-design-site.py --check
      - name: Check plan projection is current
        run: |
          python3 scripts/todo-graph.py plan --sync
          test -z "$(git status --porcelain)" || { echo "stale plan projection:"; git status --porcelain; git diff --stat; exit 1; }
      - name: Assert commit hook is intact
        run: |
          test "$(git ls-files -s tools/githooks/pre-commit | cut -d' ' -f1)" = "100755" || { echo "hook index mode is not 100755"; exit 1; }
          git show HEAD:tools/githooks/pre-commit > /tmp/hook-blob || exit 1
          if grep -q $'\r' /tmp/hook-blob; then echo "hook blob carries CR"; exit 1; fi
          git check-attr eol -- tools/githooks/pre-commit | grep -q ': eol: lf$' || { echo "hook eol pin missing"; exit 1; }

  campaign-guard:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Self-test the campaign guard
        shell: pwsh
        run: python scripts/campaign_guard.py --self-test
