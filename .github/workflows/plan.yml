name: plan-gates

# Plan tooling gates (adapted from Resolute's plan.yml): the TODO graph tool
# self-tests, the TODO tree validates, the plan projection is current, the
# commit hook is intact (mode 100755, LF), and the reviewer pin loads under
# the dispatcher's rules. The campaign guard self-test drives the configured
# Stop hook command through PowerShell and Git Bash, so it runs in a Windows job.

# No path filter: the drift gate (scripts/drift-check.py) reads every tracked text file, so a change anywhere, a
# README or a standard as much as a script, must run these gates (D00 T01 section 10).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan-gates:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the validator's git legs (provenance candidates,
          # fix-commit proofs, ancestry) cannot resolve on a shallow checkout.
          fetch-depth: 0
      - name: Self-test the TODO graph tool
        run: python3 scripts/todo-graph.py self-test
      - name: Self-test design-lint
        run: python3 scripts/design-lint.py --self-test
      - name: Self-test the native dependency lint
        run: python3 scripts/native-deps-lint.py --self-test
      - name: Self-test the native advisory check
        run: python3 scripts/check-native-advisories.py --self-test
      - name: Self-test the native standard-switch check
        run: python3 scripts/native-std-check.py --self-test
      - name: Self-test the native PE hardening check
        run: python3 scripts/native-pe-check.py --self-test
      - name: Self-test the native import and size gate
        run: python3 scripts/native-artifact-gate.py --self-test
      - name: Self-test the reviewer pin rules and the delegation wiring
        run: python3 scripts/panel_slots.py --self-test
      - name: Validate the reviewer pin, delegate pin, and agent definitions
        run: python3 scripts/panel_slots.py validate
      - name: Check the reviewer pin loads under the dispatcher's rules
        run: python3 scripts/review-dispatch.py --check-pin
      - name: Check the reviewer pin schema and three-pass schedule
        run: python3 scripts/review_pin.py --check
      - name: Test the review pin, prompt builder, dispatcher, three-pass stamp, and CI status
        run: |
          python3 scripts/tests/test_review_pin.py
          python3 scripts/tests/test_review_prompt.py
          python3 scripts/tests/test_review_dispatch.py
          python3 scripts/tests/test_three_pass.py
          python3 scripts/tests/test_isotone_three_pass_stamp.py
          python3 scripts/tests/test_ci_status.py
      - name: Self-test the weakening scan
        run: python3 scripts/weakening-scan.py --self-test
      - name: Test the scheduled automations
        run: python3 scripts/tests/test_automations.py
      - name: Test the pin checks and the settings hook scripts
        run: python3 scripts/tests/test_pin_automations.py
      - name: Test the dependency pull request merger
        run: python3 scripts/tests/test_merge_prs.py
      - name: Test the design reference renderer
        run: python3 scripts/tests/test_render_design_reference.py
      # The shrink-only baseline is compared with a trusted revision, never with the candidate itself: the
      # commit before a push, a pull request's base commit, and the first parent on a manual run.
      - name: Self-test the drift gate
        run: python3 scripts/drift-check.py --self-test
      - name: Test the drift gate's file set and this workflow's triggers
        run: python3 scripts/tests/test_drift_check.py
      - name: Check the tree against the product facts
        run: python3 scripts/drift-check.py
      # The repository's settings can only differ from the facts on the default branch: a pull request's facts
      # are not the published ones yet. Read-only, with the workflow token.
      - name: Check the GitHub repository settings against the product facts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/drift-check.py --check-github
      - name: Re-measure the claims the TODO files and the documents make
        run: python3 scripts/todo-claims.py --quiet
      - name: Validate the TODO tree
        env:
          GATE_BASE: ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || 'HEAD^' }}
        run: python3 scripts/todo-graph.py validate --base "$GATE_BASE"
      - name: Check the design system page is current
        run: python3 scripts/build-design-site.py --check
      - name: Check plan projection is current
        run: |
          python3 scripts/todo-graph.py plan --sync
          test -z "$(git status --porcelain)" || { echo "stale plan projection:"; git status --porcelain; git diff --stat; exit 1; }
      - name: Assert commit hook is intact
        run: |
          test "$(git ls-files -s tools/githooks/pre-commit | cut -d' ' -f1)" = "100755" || { echo "hook index mode is not 100755"; exit 1; }
          git show HEAD:tools/githooks/pre-commit > /tmp/hook-blob || exit 1
          if grep -q $'\r' /tmp/hook-blob; then echo "hook blob carries CR"; exit 1; fi
          git check-attr eol -- tools/githooks/pre-commit | grep -q ': eol: lf$' || { echo "hook eol pin missing"; exit 1; }

  campaign-guard:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Self-test the campaign guard
        shell: pwsh
        run: python scripts/campaign_guard.py --self-test
