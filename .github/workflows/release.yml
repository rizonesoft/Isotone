name: release

# Tag-driven releases. The tag prefix picks what ships:
#   stilus-v1.2.3  -> Stilus      gesso-v1.2.3 -> Gesso
#   albumen-v1.2.3  -> Albumen (refused by package.ps1 until Albumen ships)
#   isotone-v1.2.3 -> the Isotone Graphics Suite bundle (all shipping apps)
# A version with a hyphen (1.2.3-beta.1) is published as a prerelease.
#
# Distribution (operator decision 2026-09-27): binaries ship ONLY from rizonesoft.com.
# The installer, the portable ZIP, and SHA256SUMS are uploaded to S3-compatible object
# storage served as download.rizonesoft.com, at <base>/<slug>/<version>/<file> (slug:
# stilus, gesso, albumen, or isotone for the suite), and the update feed is written to
# <base>/update/<slug>.json (stable) or <base>/update/<slug>-prerelease.json. The GitHub
# release carries no binaries: its body is generated (the CHANGELOG section, Download
# links, the SHA-256 table, and the source link), and GitHub adds its source archives.
#
# Storage settings (Settings, Secrets and variables, Actions):
#   secrets    ISOTONE_DL_S3_ENDPOINT, ISOTONE_DL_S3_BUCKET,
#              ISOTONE_DL_S3_ACCESS_KEY_ID, ISOTONE_DL_S3_SECRET_ACCESS_KEY
#   variables  ISOTONE_DL_BASE_URL (default https://download.rizonesoft.com)
#              ISOTONE_SITE_URL    (default https://www.rizonesoft.com/)
# A tag release FAILS before building when a secret is missing, so no release is ever
# published without its downloads.
#
# Draft mode (D00 T02 §7): dispatch the workflow with a tag input and draft=true. The
# tag is not pushed; the draft release targets the dispatched commit, and uploads go
# under drafts/ (drafts/<slug>/<version>/, drafts/update/) so the live files and feeds
# are never touched. Without the storage secrets a draft skips the upload with a notice
# and its files stay in the dist-<tag> workflow artifact.
#   gh workflow run release.yml --ref main -f tag=stilus-v0.1.0-alpha.1 -f draft=true

on:
  push:
    tags:
      - 'stilus-v*'
      - 'gesso-v*'
      - 'albumen-v*'
      - 'isotone-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, <app>-v<SemVer> (stilus-v, gesso-v, albumen-v, isotone-v); not pushed for a draft'
        required: true
        type: string
      draft:
        description: 'Create a draft release (dry run): uploads go under drafts/ or are skipped'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  # Inno Setup 7 (installer/common.iss needs SetupArchitecture=x64). Chocolatey has
  # no Inno 7 package, so the official installer is fetched from the jrsoftware/issrc
  # release and checked against this hash. The image's preinstalled Inno 6 is ignored.
  INNO_SETUP_VERSION: '7.1.0'
  INNO_SETUP_SHA256: '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f'
  # rclone (MIT) uploads to the S3-compatible storage; the official Windows build is
  # fetched from downloads.rclone.org and checked against this hash (from the release's
  # SHA256SUMS, verified 2026-09-27).
  RCLONE_VERSION: '1.75.1'
  RCLONE_SHA256: '200eb602c126d82aa38b51e0f6b9ae837473ff99b51278d3f6f837574c494d6e'
  ISOTONE_DL_BASE_URL: ${{ vars.ISOTONE_DL_BASE_URL || 'https://download.rizonesoft.com' }}
  ISOTONE_SITE_URL: ${{ vars.ISOTONE_SITE_URL || 'https://www.rizonesoft.com/' }}

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve app and version from tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRAFT: ${{ inputs.draft }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # One resolution for both triggers: the dispatched tag input or the pushed tag.
          $dispatch = $env:EVENT -eq 'workflow_dispatch'
          $tag = if ($dispatch) { $env:INPUT_TAG.Trim() } else { $env:REF_NAME }
          if ($tag -notmatch '^(stilus|gesso|albumen|isotone)-v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
            throw "Tag '$tag' is not <app>-v<SemVer>"
          }
          $prefix = $Matches[1]; $version = $Matches[2]
          $app = @{ stilus = 'Stilus'; gesso = 'Gesso'; albumen = 'Albumen'; isotone = 'Suite' }[$prefix]
          $name = if ($app -eq 'Suite') { 'Isotone Graphics Suite' } else { $app }
          $title = "$name $version"
          $draft = $dispatch -and $env:INPUT_DRAFT -eq 'true'
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "app=$app" >> $env:GITHUB_OUTPUT
          "slug=$prefix" >> $env:GITHUB_OUTPUT
          "name=$name" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "title=$title" >> $env:GITHUB_OUTPUT
          "prerelease=$(($version -like '*-*').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "dispatch=$($dispatch.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "draft=$($draft.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "keyprefix=$(if ($draft) { 'drafts/' } else { '' })" >> $env:GITHUB_OUTPUT
          Write-Host "tag $tag -> app $app, version $version, draft $draft"
      - name: Check the distribution storage settings
        id: storage
        env:
          # Only whether each secret is set reaches this step, never its value.
          HAS_ENDPOINT: ${{ secrets.ISOTONE_DL_S3_ENDPOINT != '' }}
          HAS_BUCKET: ${{ secrets.ISOTONE_DL_S3_BUCKET != '' }}
          HAS_KEY_ID: ${{ secrets.ISOTONE_DL_S3_ACCESS_KEY_ID != '' }}
          HAS_SECRET: ${{ secrets.ISOTONE_DL_S3_SECRET_ACCESS_KEY != '' }}
          DRAFT: ${{ steps.tag.outputs.draft }}
        run: |
          $missing = @()
          if ($env:HAS_ENDPOINT -ne 'true') { $missing += 'ISOTONE_DL_S3_ENDPOINT' }
          if ($env:HAS_BUCKET -ne 'true') { $missing += 'ISOTONE_DL_S3_BUCKET' }
          if ($env:HAS_KEY_ID -ne 'true') { $missing += 'ISOTONE_DL_S3_ACCESS_KEY_ID' }
          if ($env:HAS_SECRET -ne 'true') { $missing += 'ISOTONE_DL_S3_SECRET_ACCESS_KEY' }
          if ($missing.Count -eq 0) {
            "upload=true" >> $env:GITHUB_OUTPUT
            Write-Host "Storage configured; downloads go to $env:ISOTONE_DL_BASE_URL"
          } elseif ($env:DRAFT -eq 'true') {
            "upload=false" >> $env:GITHUB_OUTPUT
            $msg = "Draft dry run: the upload to $env:ISOTONE_DL_BASE_URL is SKIPPED because these secrets are not set: $($missing -join ', '). The files stay in the workflow artifact."
            Write-Host "::notice title=Upload skipped::$msg"
            "> [!NOTE]`n> $msg" >> $env:GITHUB_STEP_SUMMARY
          } else {
            Write-Host "::error title=Distribution storage not configured::A release publishes its binaries only on $env:ISOTONE_DL_BASE_URL, and these secrets are not set: $($missing -join ', '). Refusing to publish a release without downloads."
            exit 1
          }
      - name: Set up .NET (global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Ensure Inno Setup 7
        run: |
          $iscc = "$env:ProgramFiles\Inno Setup 7\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $tag = 'is-' + ($env:INNO_SETUP_VERSION -replace '\.', '_')
            $url = "https://github.com/jrsoftware/issrc/releases/download/$tag/innosetup-$env:INNO_SETUP_VERSION-x64.exe"
            $exe = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
            Invoke-WebRequest -Uri $url -OutFile $exe
            $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne $env:INNO_SETUP_SHA256) { throw "Inno Setup installer hash $hash does not match the pin" }
            $p = Start-Process $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/ALLUSERS' -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Inno Setup install failed ($($p.ExitCode))" }
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc after install" }
          # The banner goes to stderr and the usage text to stdout; scan both.
          $text = (& $iscc 2>&1 | ForEach-Object { "$_" }) -join "`n"
          if ($text -notmatch 'Inno Setup 7 Command-Line Compiler') { throw "Expected Inno Setup 7 at $iscc" }
          "ISCC=$iscc" >> $env:GITHUB_ENV
          Write-Host "Using $iscc (Inno Setup 7)"
          exit 0
      - name: Test
        run: dotnet test Isotone.slnx -c Release
      - name: Package
        run: |
          # package.ps1 passes ISOTONE_SITE_URL to the installer as its publisher URL.
          $app = '${{ steps.tag.outputs.app }}'
          $version = '${{ steps.tag.outputs.version }}'
          if ($app -eq 'Suite') { ./scripts/package.ps1 -Suite -Version $version }
          else { ./scripts/package.ps1 -App $app -Version $version }
      - name: Checksums
        run: |
          Push-Location artifacts/dist
          Get-ChildItem -File -Include *.exe, *.zip -Name | Sort-Object | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant(), $_
          } | Set-Content -Encoding ascii SHA256SUMS
          Get-Content SHA256SUMS
          Pop-Location
      - name: Release notes, body, and update feed
        run: |
          # The CHANGELOG release heading names the tag (for example
          # "## [stilus-v0.1.0] - 2026-10-01"); take that section up to the next
          # "## " heading. release-manifest.ps1 adds the Download links, the SHA-256
          # table, and the source link, and writes the update feed.
          $tag = '${{ steps.tag.outputs.tag }}'
          $notesFile = 'artifacts/release-notes.md'
          if (Test-Path CHANGELOG.md) {
            $lines = Get-Content CHANGELOG.md
            $start = -1
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match '^## ' -and $lines[$i].Contains($tag)) { $start = $i; break }
            }
            if ($start -ge 0) {
              $end = $lines.Count
              for ($j = $start + 1; $j -lt $lines.Count; $j++) { if ($lines[$j] -match '^## ') { $end = $j; break } }
              if ($end -gt $start + 1) {
                Set-Content -Encoding utf8 $notesFile (($lines[($start + 1)..($end - 1)] -join "`n").Trim())
              }
            }
          }
          ./scripts/release-manifest.ps1 -Slug '${{ steps.tag.outputs.slug }}' -Name '${{ steps.tag.outputs.name }}' `
            -Version '${{ steps.tag.outputs.version }}' -Tag $tag -BaseUrl $env:ISOTONE_DL_BASE_URL -SiteUrl $env:ISOTONE_SITE_URL `
            -KeyPrefix '${{ steps.tag.outputs.keyprefix }}' -NotesFile $notesFile -OutDir artifacts/release `
            -Repository '${{ github.repository }}' -Uploaded:([bool]('${{ steps.storage.outputs.upload }}' -eq 'true'))
      - name: Install rclone
        if: steps.storage.outputs.upload == 'true'
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'rclone.zip'
          $url = "https://downloads.rclone.org/v$env:RCLONE_VERSION/rclone-v$env:RCLONE_VERSION-windows-amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:RCLONE_SHA256) { throw "rclone archive hash $hash does not match the pin" }
          $dir = Join-Path $env:RUNNER_TEMP 'rclone'
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $exe = Get-ChildItem -Path $dir -Recurse -Filter rclone.exe | Select-Object -First 1
          if (-not $exe) { throw 'rclone.exe not found in the archive' }
          "RCLONE=$($exe.FullName)" >> $env:GITHUB_ENV
          & $exe.FullName version
      - name: Upload the release files
        if: steps.storage.outputs.upload == 'true'
        env:
          # rclone reads the remote "dl" from these variables; nothing is on a command line.
          RCLONE_CONFIG_DL_TYPE: s3
          RCLONE_CONFIG_DL_PROVIDER: Other
          RCLONE_CONFIG_DL_ENDPOINT: ${{ secrets.ISOTONE_DL_S3_ENDPOINT }}
          RCLONE_CONFIG_DL_ACCESS_KEY_ID: ${{ secrets.ISOTONE_DL_S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_DL_SECRET_ACCESS_KEY: ${{ secrets.ISOTONE_DL_S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_DL_NO_CHECK_BUCKET: 'true'
          BUCKET: ${{ secrets.ISOTONE_DL_S3_BUCKET }}
        run: |
          $dest = "dl:$env:BUCKET/${{ steps.tag.outputs.keyprefix }}${{ steps.tag.outputs.slug }}/${{ steps.tag.outputs.version }}"
          # --immutable refuses to replace a published file with different bytes.
          & $env:RCLONE copy artifacts/dist $dest --immutable --include '*.exe' --include '*.zip' --include 'SHA256SUMS' `
            --header-upload 'Cache-Control: public, max-age=31536000, immutable' --stats-one-line -v
          if ($LASTEXITCODE -ne 0) { throw "rclone copy failed ($LASTEXITCODE)" }
      - name: Verify the public downloads
        if: steps.storage.outputs.upload == 'true'
        run: |
          # Every file must be served by the CDN host with the size and hash we built.
          $sums = @{}
          foreach ($line in Get-Content artifacts/dist/SHA256SUMS) { $h, $n = $line -split '\s+', 2; $sums[$n.Trim()] = $h }
          foreach ($url in Get-Content artifacts/release/files.txt) {
            $name = Split-Path $url -Leaf
            $out = Join-Path $env:RUNNER_TEMP "verify-$name"
            Invoke-WebRequest -Uri $url -OutFile $out -MaximumRetryCount 5 -RetryIntervalSec 10
            $local = Get-Item "artifacts/dist/$name"
            if ((Get-Item $out).Length -ne $local.Length) { throw "$url size differs from the build" }
            if ($name -ne 'SHA256SUMS') {
              $hash = (Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($hash -ne $sums[$name]) { throw "$url hash $hash differs from SHA256SUMS" }
            }
            Remove-Item $out
            Write-Host "OK $url"
          }
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # No files are attached: the body links the downloads on download.rizonesoft.com.
          $releaseArgs = @('release', 'create', '${{ steps.tag.outputs.tag }}', '--title', '${{ steps.tag.outputs.title }}', '--notes-file', 'artifacts/release/body.md')
          if ('${{ steps.tag.outputs.dispatch }}' -eq 'true') { $releaseArgs += @('--target', '${{ github.sha }}') }
          else { $releaseArgs += '--verify-tag' }
          if ('${{ steps.tag.outputs.draft }}' -eq 'true') { $releaseArgs += '--draft' }
          if ('${{ steps.tag.outputs.prerelease }}' -eq 'true') { $releaseArgs += '--prerelease' }
          gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed ($LASTEXITCODE)" }
      - name: Publish the update feed
        if: steps.storage.outputs.upload == 'true'
        env:
          RCLONE_CONFIG_DL_TYPE: s3
          RCLONE_CONFIG_DL_PROVIDER: Other
          RCLONE_CONFIG_DL_ENDPOINT: ${{ secrets.ISOTONE_DL_S3_ENDPOINT }}
          RCLONE_CONFIG_DL_ACCESS_KEY_ID: ${{ secrets.ISOTONE_DL_S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_DL_SECRET_ACCESS_KEY: ${{ secrets.ISOTONE_DL_S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_DL_NO_CHECK_BUCKET: 'true'
          BUCKET: ${{ secrets.ISOTONE_DL_S3_BUCKET }}
        run: |
          # Last, so the feed never names a release whose files or notes are missing.
          $dest = "dl:$env:BUCKET/${{ steps.tag.outputs.keyprefix }}update"
          & $env:RCLONE copy artifacts/release/update $dest --header-upload 'Cache-Control: public, max-age=300' --stats-one-line -v
          if ($LASTEXITCODE -ne 0) { throw "rclone copy of the update feed failed ($LASTEXITCODE)" }
          Get-ChildItem artifacts/release/update -File | ForEach-Object { Write-Host "Feed: $env:ISOTONE_DL_BASE_URL/${{ steps.tag.outputs.keyprefix }}update/$($_.Name)" }
      - name: Upload dist as workflow artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ steps.tag.outputs.tag || github.ref_name }}
          path: |
            artifacts/dist/
            artifacts/release/
          if-no-files-found: ignore
          retention-days: 30
