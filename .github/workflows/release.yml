name: release

# Tag-driven releases. The tag prefix picks what ships:
#   nodus-v1.2.3  -> Nodus      imago-v1.2.3 -> Imago
#   lumen-v1.2.3  -> Lumen (refused by package.ps1 until Lumen ships)
#   photon-v1.2.3 -> the Photon Graphics Suite bundle (all shipping apps)
# A version with a hyphen (1.2.3-beta.1) is published as a prerelease.

on:
  push:
    tags:
      - 'nodus-v*'
      - 'imago-v*'
      - 'lumen-v*'
      - 'photon-v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  # Inno Setup 7 (installer/common.iss needs SetupArchitecture=x64). Chocolatey has
  # no Inno 7 package, so the official installer is fetched from the jrsoftware/issrc
  # release and checked against this hash. The image's preinstalled Inno 6 is ignored.
  INNO_SETUP_VERSION: '7.1.0'
  INNO_SETUP_SHA256: '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f'

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve app and version from tag
        id: tag
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^(nodus|imago|lumen|photon)-v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
            throw "Tag '$tag' is not <app>-v<SemVer>"
          }
          $prefix = $Matches[1]; $version = $Matches[2]
          $app = @{ nodus = 'Nodus'; imago = 'Imago'; lumen = 'Lumen'; photon = 'Suite' }[$prefix]
          $title = if ($app -eq 'Suite') { "Photon Graphics Suite $version" } else { "$app $version" }
          "app=$app" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "title=$title" >> $env:GITHUB_OUTPUT
          "prerelease=$(($version -like '*-*').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "tag $tag -> app $app, version $version"
      - name: Set up .NET (global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Ensure Inno Setup 7
        run: |
          $iscc = "$env:ProgramFiles\Inno Setup 7\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $tag = 'is-' + ($env:INNO_SETUP_VERSION -replace '\.', '_')
            $url = "https://github.com/jrsoftware/issrc/releases/download/$tag/innosetup-$env:INNO_SETUP_VERSION-x64.exe"
            $exe = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
            Invoke-WebRequest -Uri $url -OutFile $exe
            $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne $env:INNO_SETUP_SHA256) { throw "Inno Setup installer hash $hash does not match the pin" }
            $p = Start-Process $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/ALLUSERS' -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Inno Setup install failed ($($p.ExitCode))" }
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc after install" }
          # The banner goes to stderr and the usage text to stdout; scan both.
          $text = (& $iscc 2>&1 | ForEach-Object { "$_" }) -join "`n"
          if ($text -notmatch 'Inno Setup 7 Command-Line Compiler') { throw "Expected Inno Setup 7 at $iscc" }
          "ISCC=$iscc" >> $env:GITHUB_ENV
          Write-Host "Using $iscc (Inno Setup 7)"
          exit 0
      - name: Test
        run: dotnet test Photon.slnx -c Release
      - name: Package
        run: |
          $app = '${{ steps.tag.outputs.app }}'
          $version = '${{ steps.tag.outputs.version }}'
          if ($app -eq 'Suite') { ./scripts/package.ps1 -Suite -Version $version }
          else { ./scripts/package.ps1 -App $app -Version $version }
      - name: Checksums
        run: |
          Push-Location artifacts/dist
          Get-ChildItem -File -Include *.exe, *.zip -Name | Sort-Object | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant(), $_
          } | Set-Content -Encoding ascii SHA256SUMS
          Get-Content SHA256SUMS
          Pop-Location
      - name: Release notes
        run: |
          # The CHANGELOG release heading names the tag (for example
          # "## [nodus-v0.1.0] - 2026-10-01"); take that section up to the next
          # "## " heading. Without one, GitHub generates notes from commits.
          $tag = '${{ github.ref_name }}'
          $notes = ''
          if (Test-Path CHANGELOG.md) {
            $lines = Get-Content CHANGELOG.md
            $start = -1
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match '^## ' -and $lines[$i].Contains($tag)) { $start = $i; break }
            }
            if ($start -ge 0) {
              $end = $lines.Count
              for ($j = $start + 1; $j -lt $lines.Count; $j++) { if ($lines[$j] -match '^## ') { $end = $j; break } }
              if ($end -gt $start + 1) { $notes = ($lines[($start + 1)..($end - 1)] -join "`n").Trim() }
            }
          }
          if ($notes) {
            Set-Content -Encoding utf8 artifacts/release-notes.md $notes
            "NOTES_ARGS=--notes-file artifacts/release-notes.md" >> $env:GITHUB_ENV
          } else {
            "NOTES_ARGS=--generate-notes" >> $env:GITHUB_ENV
          }
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = @(Get-ChildItem artifacts/dist -File | ForEach-Object { $_.FullName })
          $releaseArgs = @('release', 'create', '${{ github.ref_name }}') + $files + @('--title', '${{ steps.tag.outputs.title }}', '--verify-tag')
          $releaseArgs += ($env:NOTES_ARGS -split ' ')
          if ('${{ steps.tag.outputs.prerelease }}' -eq 'true') { $releaseArgs += '--prerelease' }
          gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed ($LASTEXITCODE)" }
      - name: Upload dist as workflow artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ github.ref_name }}
          path: artifacts/dist/
          if-no-files-found: ignore
          retention-days: 30
