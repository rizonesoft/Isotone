name: release

# Tag-driven releases. The tag prefix picks what ships:
#   stilus-v1.2.3  -> Stilus      gesso-v1.2.3 -> Gesso
#   albumen-v1.2.3 -> Albumen     isotone-v1.2.3 -> Isotone Graphics Suite
#
# During C# retirement (D00 T06 §2), the .NET release steps are retired while
# preserving the native advisory release gate (D00 T04 §3) ahead of the native
# release pipeline re-plan in D00 T07 §5. No release tag is pushed before the
# release re-plan lands.

on:
  push:
    tags:
      - 'stilus-v*'
      - 'gesso-v*'
      - 'albumen-v*'
      - 'isotone-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, <app>-v<SemVer> (stilus-v, gesso-v, albumen-v, isotone-v); not pushed for a draft'
        required: true
        type: string
      draft:
        description: 'Create a draft release (dry run): uploads go under drafts/ or are skipped'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Native advisory release gate
        run: python scripts/check-native-advisories.py --release-gate
      - name: Refuse release until D00 T07 §5 re-plans native release packaging
        run: |
          Write-Error "release.yml: has no native release packaging work yet; native release packaging and distribution are re-planned in D00 T07 §5." -ErrorAction Continue
          exit 1
