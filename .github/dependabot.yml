version: 2
updates:
  # NuGet: versions live in Directory.Packages.props (central package management).
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      microsoft:
        patterns:
          - "Microsoft.*"
          - "System.*"
      skiasharp:
        patterns:
          - "SkiaSharp*"
      testing:
        patterns:
          - "xunit*"
          - "coverlet.*"
          - "Moq"
          - "AwesomeAssertions"
          - "Microsoft.NET.Test.Sdk"
      serilog:
        patterns:
          - "Serilog*"
      nuget-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions: pinned by full SHA; Dependabot bumps the SHA and the tag comment.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns:
          - "*"
