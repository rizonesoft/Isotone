<?xml version="1.0" encoding="UTF-8"?>
<!-- This is a test SVG with bloat for optimization testing -->
<svg xmlns="http://www.w3.org/2000/svg" 
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
     width="200" height="200" viewBox="0 0 200 200">
  
  <title>Test Icon</title>
  <desc>A sample SVG with metadata and editor data for testing the optimizer</desc>
  
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
      <rdf:Description>
        Created with some editor
      </rdf:Description>
    </rdf:RDF>
  </metadata>
  
  <!-- Empty groups that should be removed -->
  <g id="empty-group-1"></g>
  <g id="empty-group-2">   </g>
  
  <!-- Actual content -->
  <g id="main-content">
    <circle cx="100.123456789" cy="100.987654321" r="80.555555555" fill="#89B4FA" opacity="0.9"/>
    <rect x="60.111111" y="60.222222" width="80.333333" height="80.444444" rx="10.555555" fill="#A6E3A1"/>
    <path d="M 100.123 50.456 L 150.789 150.012 L 50.345 150.678 Z" fill="#F38BA8"/>
  </g>
  
  <!-- Single child group that could be collapsed -->
  <g id="wrapper">
    <text x="100" y="180" text-anchor="middle" fill="#CDD6F4" font-size="12">Bezier Test SVG</text>
  </g>
  
  <!-- inkscape specific data -->
  <sodipodi:namedview inkscape:zoom="1.5" inkscape:cx="100" inkscape:cy="100"/>
  
</svg>
